version: '3.8'

services:
  control-plane:
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
    container_name: karvion-control-plane
    restart: unless-stopped
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - DATABASE_URL=file:/opt/karvion/karvion.db
      - JWT_SECRET=karvion-production-jwt-secret-key-change-in-prod
      - STORAGE_ROOT=/opt/karvion
      - NODE_ENV=production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - karvion-data:/opt/karvion
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: karvion-web
    restart: unless-stopped
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - control-plane

volumes:
  karvion-data:
    name: karvion-data
